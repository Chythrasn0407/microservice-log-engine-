version: '3.8'

services:
  log-triage-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: microservice-log-engine:v1.0.0
    container_name: microservice_log_triage_engine
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

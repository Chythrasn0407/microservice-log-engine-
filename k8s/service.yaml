apiVersion: v1
kind: Service
metadata:
  name: microservice-log-engine-service
  labels:
    app: microservice-log-engine
    tier: analytics
spec:
  type: ClusterIP
  selector:
    app: microservice-log-engine
  ports:
    - name: http
      port: 80
      targetPort: 8501
      protocol: TCP
---
# Optional NodePort Service for local Minikube / Docker Desktop Kubernetes testing:
apiVersion: v1
kind: Service
metadata:
  name: microservice-log-engine-nodeport
  labels:
    app: microservice-log-engine
    tier: analytics
spec:
  type: NodePort
  selector:
    app: microservice-log-engine
  ports:
    - name: http
      port: 8501
      targetPort: 8501
      nodePort: 30501
      protocol: TCP
